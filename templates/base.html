{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DJA02 Social{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="navbar">
    <a class="brand" href="{% url 'home' %}">DJA02 Social</a>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' user.username %}">Profile</a>
            <a class="btn" href="{% url 'post_create' %}">Create Post</a>
            <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link-btn">Logout</button></form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a class="btn" href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
</header>
<main class="container">
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
